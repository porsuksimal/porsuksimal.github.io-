<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şimal Porsuk | Kişisel Web Sitesi</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --pink-light: #fff0f5;
            --pink-soft: #fbcfe8;
            --pink-main: #f472b6;
            --pink-dark: #db2777;
            --pink-deep: #831843;
            --text-main: #374151;
            --bg-card: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--pink-light);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(219, 39, 119, 0.1);
            margin-bottom: 30px;
            border: 2px solid #f9a8d4;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        h1 {
            color: var(--pink-deep);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--pink-dark);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            background-color: var(--pink-dark);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #fbcfe8;
        }

        h2 {
            color: var(--pink-dark);
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--pink-soft);
            padding-bottom: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #fff5f8;
            padding: 12px 15px;
            border-radius: 10px;
            border-left: 4px solid var(--pink-main);
        }

        .info-item strong {
            color: var(--pink-deep);
            display: block;
            font-size: 0.85rem;
        }

        .info-item span {
            font-size: 1rem;
            color: #4b5563;
        }

        .interactive-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--pink-deep);
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--pink-soft);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--pink-dark);
        }

        button {
            background-color: var(--pink-dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--pink-deep);
        }
